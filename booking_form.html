<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Equipment Reservation</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f2f5fa; margin: 0; padding: 24px; }
    .card { max-width: 460px; margin: 0 auto; background: #fff; padding: 28px;
            border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
    h1 { font-size: 22px; color: #1a3d7c; margin-top: 0; }
    label { display: block; margin: 14px 0 4px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #bbb; border-radius: 6px; font-size: 15px; }
    button { margin-top: 22px; width: 100%; padding: 12px; background: #1a3d7c; color: #fff;
             border: 0; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover { background: #12306a; }
    .hint { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Campus Equipment Reservation</h1>
    <form action="ReservationServlet" method="POST">
      <label for="userName">Full Name</label>
      <input type="text" id="userName" name="userName" maxlength="100" required>

      <label for="userRole">Role</label>
      <select id="userRole" name="userRole" required>
        <option value="STUDENT">Student</option>
        <option value="FACULTY">Faculty (15% discount)</option>
      </select>

      <label for="itemCategory">Item</label>
      <select id="itemCategory" name="itemCategory" required>
        <option value="LAPTOP">Laptop (50 AED/day)</option>
        <option value="PROJECTOR">Projector (80 AED/day)</option>
        <option value="POD">Study Pod (100 AED/day)</option>
      </select>

      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" name="quantity" min="1" max="100" required>

      <label for="bookingDays">Booking Days</label>
      <input type="number" id="bookingDays" name="bookingDays" min="1" max="30" required>
      <div class="hint">Maximum 30 days per booking.</div>

      <button type="submit">Reserve</button>
    </form>
  </div>
</body>
</html>
